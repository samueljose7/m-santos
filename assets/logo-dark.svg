<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" width="280" height="56" fill="none">
  <defs>
    <!-- Gold Gradient (Luminous Accent) -->
    <linearGradient id="msGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B20D" />
      <stop offset="50%" stop-color="#C99400" />
      <stop offset="100%" stop-color="#9E7400" />
    </linearGradient>

    <!-- Dark Metal Gradient -->
    <linearGradient id="msSteelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3135" />
      <stop offset="100%" stop-color="#171A1D" />
    </linearGradient>

    <!-- Glass Refraction -->
    <linearGradient id="msGlassDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5B20D" />
      <stop offset="100%" stop-color="#F4CE19" />
    </linearGradient>
  </defs>

  <!-- ========================================================
       EMBLEM: Architectural "M" (Light Version)
       ======================================================== -->
  <g transform="translate(6, 4)">
    <!-- Base plate -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#F8F9FA" stroke="url(#msGoldDark)" stroke-width="1.5" />

    <!-- Left Structural Column -->
    <path d="M12 37V15.5L19.5 25.5V37H12Z" fill="url(#msSteelDark)" />

    <!-- Right Structural Column -->
    <path d="M36 37V15.5L28.5 25.5V37H36Z" fill="url(#msSteelDark)" />

    <!-- Center Faceted Prism -->
    <path d="M24 12L19.5 25.5L24 31.5L28.5 25.5L24 12Z" fill="url(#msGlassDark)" />

    <!-- Central Reflection Line -->
    <path d="M24 12V31.5" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-opacity="0.9" />

    <!-- Precision Base Frame -->
    <rect x="12" y="35" width="24" height="2" rx="1" fill="url(#msGoldDark)" />

    <!-- Top Accent Sparkle -->
    <circle cx="24" cy="8.5" r="1.5" fill="#E5B20D" />
  </g>

  <!-- ========================================================
       TYPOGRAPHY LOCKUP
       ======================================================== -->
  <!-- Primary Wordmark -->
  <text x="68" y="27" font-family="'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#171A1D" letter-spacing="1.2">
    M<tspan fill="url(#msGoldDark)">.</tspan> SANTOS
  </text>

  <!-- Tagline -->
  <text x="69" y="41" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="url(#msGoldDark)" letter-spacing="2.6">
    VIDRAÇARIA <tspan fill="#65686B">•</tspan> SERRALHERIA
  </text>
</svg>
